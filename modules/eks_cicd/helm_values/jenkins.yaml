# Jenkins stores its generated admin password in a Kubernetes Secret.
# The controller service stays private behind the Terraform-managed ALB Ingress.
${yamlencode({
  controller = {
    jenkinsUrl = "https://${jenkins_url}"
    serviceType = "ClusterIP"
    agentListenerServiceType = "ClusterIP"
    ingress = {
      enabled = false
    }
    # Re-run chart initialization so newly declared plugins are installed on upgrades.
    initializeOnce       = false
    installLatestPlugins = false
    additionalPlugins    = ["job-dsl:3732.v9a_c49a_61a_313"]
    additionalExistingSecrets = jenkins_gitops_secret_name == null ? [] : [
      for key in ["username", "token"] : {
        name    = jenkins_gitops_secret_name
        keyName = key
      }
    ]
    initScripts = jenkins_gitops_secret_name == null ? {} : {
      gitops-credential = jenkins_gitops_init_script
    }
    # Restart the controller on rotation so the init hook reads the updated Secret.
    podAnnotations = jenkins_gitops_secret_name == null ? {} : {
      "ci.aws-eks/gitops-credential-revision" = jenkins_gitops_revision
    }
    JCasC = {
      defaultConfig = true
      configScripts = {
        multibranch-pipeline = <<-EOT
          jobs:
            - script: |
                multibranchPipelineJob('${jenkins_pipeline_job_name}') {
                  branchSources {
                    git {
                      id = '${jenkins_pipeline_job_name}'
                      remote('${jenkins_pipeline_repository_url}')
                      includes('${jenkins_pipeline_branch_includes}')
                      excludes('${jenkins_pipeline_branch_excludes}')
                    }
                  }
                  factory {
                    workflowBranchProjectFactory {
                      scriptPath('${jenkins_pipeline_script_path}')
                    }
                  }
                  triggers {
                    periodic(${tonumber(trimsuffix(jenkins_pipeline_scan_interval, "m"))})
                  }
                }
        EOT
      }
    }
  }
  # The chart creates the controller's agent scheduling RoleBinding here.
  agent = {
    namespace = jenkins_agent_namespace
  }
  additionalAgents = {
    aws-eks-app = {
      podName        = "aws-eks-app"
      componentName  = "aws-eks-app-agent"
      connectTimeout = 180
      serviceAccount = jenkins_agent_service_account
      image = {
        repository = "jenkins/inbound-agent"
        tag        = "latest-jdk21@sha256:c93e68c1b1a9e5c4cb8e459dfd0f7fc63b6dc86b47f12883b8231c85d2e4ca4d"
      }
      yamlTemplate = jenkins_agent_pod_yaml
    }
  }
  persistence = {
    enabled     = true
    storageClass = storage_class
    accessMode  = "ReadWriteOnce"
    size        = "8Gi"
  }
})}
